name: Build IzviniteVpn APK
# Trigger APK build after the auth API compatibility fix.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, master, feature/izvinitevpn-v2, feature/vpn-ui-admin-complete ]

concurrency:
  group: izvinitevpn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org ru.yusupov --project-name izvinitevpn build_src
          cp pubspec.yaml build_src/pubspec.yaml
          rm -rf build_src/lib
          cp -R lib build_src/lib
          sed -i 's/android:label="build_src"/android:label="IzviniteVpn"/' build_src/android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' build_src/android/app/build.gradle.kts
          mkdir -p build_src/android/app/src/main/res/drawable build_src/android/app/src/main/res/mipmap-anydpi-v26 build_src/android/app/src/main/res/values
          cp android-icon/ic_launcher_foreground.xml build_src/android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp android-icon/ic_launcher.xml build_src/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-icon/colors.xml build_src/android/app/src/main/res/values/ic_launcher_colors.xml
          cd build_src
          flutter pub get
      - name: Validate Worker JavaScript
        run: node --check cloudflare/src/index.js
      - name: Validate API endpoint
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || (echo "Set repository Actions variable API_BASE_URL after deploying the auth API"; exit 1)
          case "$API_BASE_URL" in https://*) ;; *) echo "API_BASE_URL must use HTTPS"; exit 1 ;; esac
      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cd build_src
          flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: IzviniteVpn-arm64-apk
          path: build_src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
